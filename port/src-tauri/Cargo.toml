[package]
name = "odoo-tauri"
version = "0.1.0"
edition = "2021"

# Standalone (not a workspace member) so the web/server workspace builds without the webview toolchain.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
odoo-app = { path = "../crates/odoo-app" }
serde_json = "1"
