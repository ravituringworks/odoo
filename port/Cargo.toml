[workspace]
resolver = "2"
members = ["crates/odoo-modules", "crates/odoo-app", "crates/odoo-duckdb", "crates/odoo-postgres", "crates/odoo-mysql", "crates/odoo-core", "crates/odoo-sqlite", "crates/odoo-server"]

[workspace.package]
edition = "2021"
license = "LGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
